name: Create Archive

on:
  pull_request_target:
    types: [closed]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 1. Grant write permissions to the GITHUB_TOKEN
    permissions:
      contents: write

    steps:
    - name: Checkout target branch
      uses: actions/checkout@v7
      with:
        persist-credentials: true
        ref: ${{ github.event.pull_request.base.ref }}
        fetch-depth: 0


    - name: Remove old archive if it exists
      run: |
        rm -f LimaruResourcePack.zip

    - name: Zip release
      uses: thedoctor0/zip-release@master
      with:
        filename: 'LimaruResourcePack.zip'
        exclusions: '*.git* *.github* /*node_modules/* .editorconfig CODE_OF_CONDUCT.md CONTRIBUTING.md README.md'

    - name: Commit and push archive
      env:
        BRANCH: ${{ github.event.pull_request.base.ref }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add LimaruResourcePack.zip
        if git diff --cached --quiet; then
          echo "No changes to the zip file."
          exit 0
        fi

        git commit -m "auto: update LimaruResourcePack.zip [skip ci]"

        git fetch origin "$BRANCH"
        git rebase "origin/$BRANCH"
        git push origin "HEAD:$BRANCH"

